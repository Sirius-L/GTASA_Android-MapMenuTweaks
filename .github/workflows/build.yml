name: Build Android NDK Plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout your code
      uses: actions/checkout@v4

    - name: Checkout AML SDK (RusJJ/AndroidModLoader)
      uses: actions/checkout@v4
      with:
        repository: RusJJ/AndroidModLoader
        path: aml-sdk

    - name: Checkout SAUtils SDK
      uses: actions/checkout@v4
      with:
        repository: AndroidModLoader/SAUtils
        path: sautils-sdk

    - name: Setup NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r21e

    - name: Build with ndk-build
      run: |
        echo "=== 开始编译 ==="
        ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk NDK_APPLICATION_MK=Application.mk APP_CFLAGS="-I$(pwd)/aml-sdk -I$(pwd)/sautils-sdk" || {
          echo "=== 编译失败，以下为详细错误信息 ==="
          ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk NDK_APPLICATION_MK=Application.mk APP_CFLAGS="-I$(pwd)/aml-sdk -I$(pwd)/sautils-sdk" V=1
          exit 1
        }

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Plugin
        path: libs/
