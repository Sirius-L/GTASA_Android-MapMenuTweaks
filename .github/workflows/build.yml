name: Build Android NDK Plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout your code
      uses: actions/checkout@v4

    - name: Checkout AML SDK (RusJJ/AndroidModLoader)
      uses: actions/checkout@v4
      with:
        repository: RusJJ/AndroidModLoader
        path: aml-sdk  # 下载到当前目录下的 aml-sdk 文件夹

    - name: Setup NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r21e

    - name: Build with ndk-build
      run: |
        echo "=== 开始编译 ==="
        # 通过 APP_CFLAGS 告诉编译器包含 aml-sdk 里的头文件目录
        ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk NDK_APPLICATION_MK=Application.mk APP_CFLAGS="-I$(pwd)/aml-sdk" || {
          echo "=== 编译失败，以下为详细错误信息 ==="
          ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk NDK_APPLICATION_MK=Application.mk APP_CFLAGS="-I$(pwd)/aml-sdk" V=1
          exit 1
        }

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Plugin
        path: libs/
